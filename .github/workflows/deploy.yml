name: 🚀 Deploy to Azure Static Website

on:
  push:
    branches:
      - main
  workflow_dispatch:       # allows manual trigger from the GitHub Actions tab

jobs:
  deploy:
    name: Deploy to Azure Blob Storage
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ───────────────────────────────────────────────────
      - name: ⬇ Checkout repository
        uses: actions/checkout@v4

      # ── 2. Install Azure CLI ───────────────────────────────────────────────
      - name: 🔧 Install Azure CLI
        run: |
          curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash

      # ── 3. Upload all website files ────────────────────────────────────────
      - name: 📦 Upload HTML files
        run: |
          az storage blob upload-batch \
            --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
            --account-key  "${{ secrets.AZURE_STORAGE_KEY }}" \
            --source . \
            --destination '$web' \
            --pattern "*.html" \
            --content-type "text/html" \
            --overwrite

      - name: 🎨 Upload CSS files
        run: |
          az storage blob upload-batch \
            --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
            --account-key  "${{ secrets.AZURE_STORAGE_KEY }}" \
            --source . \
            --destination '$web' \
            --pattern "*.css" \
            --content-type "text/css" \
            --overwrite

      - name: ⚡ Upload JavaScript files
        run: |
          az storage blob upload-batch \
            --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
            --account-key  "${{ secrets.AZURE_STORAGE_KEY }}" \
            --source . \
            --destination '$web' \
            --pattern "*.js" \
            --content-type "application/javascript" \
            --overwrite

      - name: 🖼 Upload assets
        run: |
          az storage blob upload-batch \
            --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
            --account-key  "${{ secrets.AZURE_STORAGE_KEY }}" \
            --source assets \
            --destination '$web/assets' \
            --overwrite

      # ── 4. Print live URL ──────────────────────────────────────────────────
      - name: 🌍 Print live URL
        run: |
          az storage account show \
            --name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
            --query "primaryEndpoints.web" \
            --output tsv \
            --auth-mode key \
            --account-key "${{ secrets.AZURE_STORAGE_KEY }}" 2>/dev/null || \
          echo "https://${{ secrets.AZURE_STORAGE_ACCOUNT }}.z13.web.core.windows.net/"
