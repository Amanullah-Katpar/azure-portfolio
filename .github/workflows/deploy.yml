name: 🚀 Deploy to Azure Static Website

on:
  push:
    branches:
      - main
  workflow_dispatch:        # allows manual trigger from the GitHub Actions tab

jobs:
  deploy:
    name: Deploy to Azure Blob Storage
    runs-on: ubuntu-latest

    steps:
      - name: ⬇ Checkout repository
        uses: actions/checkout@v4

      - name: 📄 Upload HTML files
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az storage blob upload-batch \
              --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
              --account-key  "${{ secrets.AZURE_STORAGE_KEY }}" \
              --source . \
              --destination '$web' \
              --pattern "*.html" \
              --content-type "text/html" \
              --overwrite

      - name: 🎨 Upload CSS files
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az storage blob upload-batch \
              --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
              --account-key  "${{ secrets.AZURE_STORAGE_KEY }}" \
              --source . \
              --destination '$web' \
              --pattern "*.css" \
              --content-type "text/css" \
              --overwrite

      - name: ⚡ Upload JavaScript files
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az storage blob upload-batch \
              --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
              --account-key  "${{ secrets.AZURE_STORAGE_KEY }}" \
              --source . \
              --destination '$web' \
              --pattern "*.js" \
              --content-type "application/javascript" \
              --overwrite

      - name: 🖼 Upload assets
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az storage blob upload-batch \
              --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
              --account-key  "${{ secrets.AZURE_STORAGE_KEY }}" \
              --source assets \
              --destination '$web/assets' \
              --overwrite

      - name: 🌍 Print live URL
        run: |
          echo "🌍 Portfolio is live at: https://${{ secrets.AZURE_STORAGE_ACCOUNT }}.z13.web.core.windows.net/"
